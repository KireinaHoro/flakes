on:
  push:
    branches:
      - master
  repository_dispatch:
    types: [deploy_flakes]

jobs:
  deploy_job:
    runs-on: ubuntu-latest
    name: Deploy flakes
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/image-cache
        with:
          image-name: kireinahoro/flakes-base:v1
      - name: deploy flake on kage
        uses: ./.github/actions/deploy
        with:
          flake: 'github:KireinaHoro/flakes'
          privkey: ${{ secrets.ACTIONS_PRIVKEY }}
          host: kage
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
